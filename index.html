<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Conti</title>
<meta name="description" content="Entrate e uscite personali">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="theme-color" content="#2563EB">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Conti">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png?v=2">
<link rel="icon" href="icons/icon-192.png?v=2">
<style>
:root{
  color-scheme:light;
  --bg:#F9FAFB; --surface:#FFFFFF; --line:rgba(0,0,0,.09); --text:#0A0A0A; --muted:#717182; --faint:#A1A1AA;
  --brand:#2563EB; --brand-ink:#FFFFFF; --brand-soft:rgba(255,255,255,.82); --wash:rgba(37,99,235,.10);
  --grad:linear-gradient(90deg,#2563EB,#9333EA);
  --pos:#16A34A; --neg:#DC2626; --pos-bg:#DCFCE7; --neg-bg:#F3F4F6; --danger-bg:#FEE2E2; --chip:#ECECF0;
  --sheet:#FFFFFF; --nav:#FFFFFF; --shadow:0 10px 30px rgba(0,0,0,.18); --r:14px; --navh:62px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-tema="chiaro"]){
    color-scheme:dark; --bg:#0A0A0B; --surface:#151518; --line:#27272A; --text:#FAFAFA; --muted:#A1A1AA; --faint:#71717A;
    --brand:#3B82F6; --brand-soft:rgba(255,255,255,.8); --wash:rgba(59,130,246,.16); --grad:linear-gradient(90deg,#1D4ED8,#7E22CE);
    --pos:#4ADE80; --neg:#F87171; --pos-bg:#12301F; --neg-bg:#27272A; --danger-bg:#3A1C1C; --chip:#27272A; --sheet:#151518; --nav:#151518; --shadow:0 10px 30px rgba(0,0,0,.5);
  }
}
:root[data-tema="scuro"]{
    color-scheme:dark; --bg:#0A0A0B; --surface:#151518; --line:#27272A; --text:#FAFAFA; --muted:#A1A1AA; --faint:#71717A;
    --brand:#3B82F6; --brand-soft:rgba(255,255,255,.8); --wash:rgba(59,130,246,.16); --grad:linear-gradient(90deg,#1D4ED8,#7E22CE);
    --pos:#4ADE80; --neg:#F87171; --pos-bg:#12301F; --neg-bg:#27272A; --danger-bg:#3A1C1C; --chip:#27272A; --sheet:#151518; --nav:#151518; --shadow:0 10px 30px rgba(0,0,0,.5);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{overscroll-behavior-y:none}
body::before{content:'';position:fixed;top:0;left:0;right:0;height:env(safe-area-inset-top);background:var(--grad);z-index:10}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
.num{font-variant-numeric:tabular-nums}
.pos{color:var(--pos)} .neg{color:var(--neg)}

/* header */
header{position:relative;z-index:5;background:var(--grad);color:var(--brand-ink);padding:calc(env(safe-area-inset-top) + 8px) 16px 18px}
.bar{display:flex;align-items:center;gap:6px;min-height:40px}
.period{display:flex;align-items:center;gap:2px;flex:1;min-width:0}
.period .lbl{font-size:20px;font-weight:650;letter-spacing:-.01em;padding:6px 6px;border-radius:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.period .lbl:active{background:rgba(255,255,255,.12)}
.period .caret{opacity:.7;font-size:13px;margin-left:4px}
.ibtn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none}
.ibtn:active{background:rgba(255,255,255,.14)}
.ibtn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ibtn.small{width:32px;height:32px} .ibtn.small svg{width:18px;height:18px}
.spin svg{animation:spin 1s linear infinite} @keyframes spin{to{transform:rotate(360deg)}}
.hero{text-align:center;padding:10px 0 0}
.hero .cap{display:flex;justify-content:center;align-items:center;gap:2px;font-size:13px;color:var(--brand-soft);letter-spacing:.02em;margin:-4px 0 -2px}
.hero .cap .ibtn{opacity:.9}
.hero .big{font-size:36px;font-weight:700;letter-spacing:-.02em;margin:2px 0 0}
.hero.c .big{font-size:28px}
.hero .plan{font-size:12.5px;color:var(--brand-soft);margin-top:8px}
.tiles{display:flex;gap:12px;margin-top:16px}
.tiles>div{flex:1;min-width:0;background:rgba(255,255,255,.2);border-radius:10px;padding:10px 12px;text-align:center}
.tiles .k{display:flex;justify-content:center;align-items:center;gap:6px;font-size:13px;color:var(--brand-soft)}
.tiles .k svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.tiles .k.in svg{stroke:#86EFAC}.tiles .k.out svg{stroke:#FCA5A5}
.tiles .v{font-weight:600;font-size:17px;margin-top:3px;color:#fff}
.ttl{font-size:22px;font-weight:650;margin:0;padding:6px}
.seg{display:inline-flex;background:rgba(255,255,255,.12);border-radius:10px;padding:2px;margin-top:14px}
.seg button{font-size:13px;padding:5px 12px;border-radius:8px;color:var(--brand-soft)}
.seg button.on{background:var(--brand-ink);color:var(--brand)}

/* list */
main{padding-bottom:calc(env(safe-area-inset-bottom) + var(--navh) + 44px)}
.status{font-size:12px;color:var(--muted);text-align:center;padding:10px 16px 2px;cursor:pointer}
.status.err{color:var(--neg)}
.day{position:sticky;top:env(safe-area-inset-top);z-index:2;display:flex;justify-content:space-between;align-items:baseline;background:var(--bg);padding:14px 16px 6px;font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.day .tot{font-weight:500;letter-spacing:0;text-transform:none}
.day.future{color:var(--faint)}
.month{padding:22px 16px 2px;font-size:15px;font-weight:700;color:var(--text)}
.group{margin:0 16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.row{position:relative;display:flex;align-items:center;gap:12px;padding:10px 16px;min-height:62px}
.row + .row::before{content:'';position:absolute;top:0;left:66px;right:0;border-top:1px solid var(--line)}
.row.plan{opacity:.45}
button.row{width:100%;text-align:left}
button.row:active{background:var(--chip)}
.ico{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-size:19px;flex:none;background:var(--neg-bg)}
.ico.in{background:var(--pos-bg)}
.ico svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ico.set{background:var(--chip);color:var(--muted)}
.txt{flex:1;min-width:0}
.t1{font-weight:600;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t1 .sub{font-weight:400;color:var(--muted)}
.t2{font-size:13.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.t2 .rep{color:var(--faint)}
.amt{text-align:right;flex:none}
.amt .v{font-weight:600;font-size:16px}
.amt .s{font-size:12px;color:var(--faint);margin-top:1px}
.empty{text-align:center;color:var(--muted);padding:60px 24px}
.fut{display:block;width:calc(100% - 32px);margin:12px 16px 0;padding:11px 14px;border-radius:12px;background:var(--chip);font-size:14px;color:var(--muted);text-align:left}
.more{display:block;margin:14px auto;padding:10px 16px;border-radius:10px;background:var(--chip);font-size:14px}
.empty{padding:50px 24px}

/* sheets & screens */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:20;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--sheet);border-radius:16px 16px 0 0;box-shadow:var(--shadow);padding:10px 16px calc(env(safe-area-inset-bottom) + 16px);transform:translateY(105%);transition:transform .25s ease}
.sheet.open{transform:none}
.sheet .hd{display:flex;align-items:center;justify-content:space-between;padding:4px 0 14px}
.sheet .hd b{font-size:17px}
.txtbtn{font-size:16px;color:var(--brand);font-weight:600;padding:8px 4px}
.seg2{display:flex;background:var(--chip);border-radius:10px;padding:2px;margin-bottom:14px}
.seg2 button{flex:1;padding:8px;border-radius:8px;font-size:15px;color:var(--muted)}
.seg2 button.on{background:var(--surface);color:var(--text);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.pick{display:flex;gap:10px}
.pick select{flex:1;font:inherit;font-size:17px;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--text);-webkit-appearance:none;appearance:none;text-align:center}
.pick select:disabled{opacity:.35}
.quick{display:flex;gap:8px;margin-top:12px}
.quick button{flex:1;padding:10px;border-radius:10px;background:var(--chip);font-size:14px}

.screen{position:fixed;inset:0;z-index:15;background:var(--bg);display:flex;flex-direction:column;transform:translateX(100%);transition:transform .25s ease;visibility:hidden}
.screen.open{transform:none;visibility:visible}
.screen .top{background:var(--grad);color:var(--brand-ink);padding:calc(env(safe-area-inset-top) + 8px) 8px 10px;display:flex;align-items:center;gap:6px}
.screen .top h2{font-size:18px;margin:0;font-weight:650;flex:1}
.screen .body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:calc(env(safe-area-inset-bottom) + 30px)}
.search{flex:1;display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.14);border-radius:12px;padding:0 12px;height:40px}
.search input{flex:1;border:0;background:none;color:var(--brand-ink);font:inherit;font-size:16px;outline:none;min-width:0}
.search input::placeholder{color:var(--brand-soft)}
.search input::-webkit-search-cancel-button{-webkit-appearance:none}
.search svg{width:18px;height:18px;stroke:var(--brand-soft);fill:none;stroke-width:2}
.sum{display:flex;justify-content:space-between;padding:12px 16px 4px;font-size:13px;color:var(--muted)}
.ric .meta{font-size:13px;color:var(--muted);margin-top:2px;line-height:1.45}
.ric .meta b{color:var(--text);font-weight:500}
.sec{padding:20px 16px 6px;font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}

/* inserimento */
.evbar{display:flex;align-items:center;gap:8px;margin:10px 16px 0;padding:9px 12px;border-radius:12px;background:var(--chip);font-size:14px}
.evbar b{flex:1;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.evbar button{color:var(--neg);font-weight:600;font-size:14px}
.form{padding:14px 16px calc(env(safe-area-inset-bottom) + 100px)}
.lab{font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin:18px 0 8px}
.lab:first-child{margin-top:4px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:8px 12px;border-radius:999px;background:var(--chip);font-size:14.5px;line-height:1.2}
.chip.on{background:var(--brand);color:var(--brand-ink)}
.chip.pref{background:var(--surface);border:1px solid var(--line)}
.scroll-x{display:flex;gap:8px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:4px;margin:0 -16px;padding-left:16px;padding-right:16px}
.scroll-x .chip{flex:none}
.scroll-x.f{margin:0;padding:14px 16px 2px}
.amtin{display:flex;align-items:baseline;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:6px 14px}
.amtin input{flex:1;border:0;background:none;color:var(--text);font:inherit;font-size:34px;font-weight:700;letter-spacing:-.02em;outline:none;min-width:0;font-variant-numeric:tabular-nums}
.amtin span{font-size:24px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.tile{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px;border-radius:12px;background:var(--surface);border:1px solid var(--line);font-size:12.5px;text-align:center;line-height:1.15;min-height:72px}
.tile .e{font-size:22px}
.tile.on{border-color:var(--brand);box-shadow:inset 0 0 0 1.5px var(--brand)}
.fld{width:100%;font:inherit;font-size:16px;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--text);-webkit-appearance:none;appearance:none}
.row2{display:flex;gap:10px}.row2>*{flex:1;min-width:0}
.seg3{display:flex;background:var(--chip);border-radius:10px;padding:2px}
.seg3 button{flex:1;padding:9px 4px;border-radius:8px;font-size:14.5px;color:var(--muted)}
.seg3 button.on{background:var(--surface);color:var(--text);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.savebar{position:fixed;left:0;right:0;bottom:0;z-index:16;padding:12px 16px calc(env(safe-area-inset-bottom) + 12px);background:linear-gradient(to top,var(--bg) 70%,transparent)}
.savebar button{width:100%;padding:15px;border-radius:14px;background:var(--brand);color:var(--brand-ink);font-weight:650;font-size:17px}
.savebar button:disabled{opacity:.4}
.danger{width:100%;margin-top:10px;padding:13px;border-radius:12px;background:var(--neg-bg);color:var(--neg);font-weight:600}
.hint{font-size:13px;color:var(--muted);margin-top:6px}
.links{display:flex;gap:8px;margin-top:12px}
.links button{flex:1;padding:12px;border-radius:12px;background:var(--chip);font-size:14.5px}
.toast{position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom) + var(--navh) + 44px);z-index:30;display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:14px;background:#23272B;color:#F1F3F4;font-size:14px;box-shadow:var(--shadow);opacity:0;transform:translateY(10px);transition:.2s;pointer-events:none}
.toast.on{opacity:1;transform:none;pointer-events:auto}
.toast span{flex:1}
.toast button{color:#9FD0B3;font-weight:650}
.row[data-id]{cursor:pointer}
.row[data-id]:active{background:var(--chip)}
.coda{font-size:12px;color:var(--neg);text-align:center;padding-top:4px}
.setup{max-width:420px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 60px) 24px 40px}
.setup h1{font-size:26px;margin:0 0 8px}
.setup p{color:var(--muted);margin:0 0 18px}
.setup input{width:100%;font:inherit;font-size:16px;padding:14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--text)}
.setup .go{width:100%;margin-top:12px;padding:14px;border-radius:12px;background:var(--brand);color:var(--brand-ink);font-weight:600}
.setup .err{color:var(--neg);font-size:14px;margin-top:10px;min-height:20px}
.setup label{display:block;font-size:13px;color:var(--muted);margin:14px 0 6px}
.setup .alt{display:block;margin:18px auto 0;font-size:14px;color:var(--muted);text-decoration:underline}
.setup .lock{font-size:40px;margin-bottom:8px}

/* kit: navigazione, sezioni, grafici, impostazioni */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:12;display:flex;filter:drop-shadow(0 -2px 8px rgba(0,0,0,.07))}
nav.tabs .nl,nav.tabs .nr{flex:1;display:flex;justify-content:space-around;align-items:flex-start;background:var(--nav);border-top:1px solid var(--line);height:calc(var(--navh) + env(safe-area-inset-bottom));padding:4px 6px 0}
nav.tabs .nc{position:relative;width:112px;flex:none;display:flex;flex-direction:column;height:calc(var(--navh) + env(safe-area-inset-bottom))}
nav.tabs .nc>svg{display:block;width:112px;height:40px;flex:none}
nav.tabs .nfill{flex:1;background:var(--nav);margin-top:-1px}
nav.tabs .nl button,nav.tabs .nr button{flex:1;height:50px;display:grid;place-items:center;color:var(--faint);max-width:84px}
nav.tabs .nl button.on,nav.tabs .nr button.on{color:var(--brand)}
nav.tabs .nl button.on svg,nav.tabs .nr button.on svg{stroke-width:2.3}
nav.tabs .nl svg,nav.tabs .nr svg{stroke:currentColor;fill:none;stroke-linecap:round;stroke-linejoin:round}
nav.tabs .cf{fill:var(--nav)}
nav.tabs .cs{fill:none;stroke:var(--line);stroke-width:1}
nav.tabs .nl svg,nav.tabs .nr svg{width:25px;height:25px;stroke-width:1.8}
.fab{position:absolute;left:50%;top:-28px;transform:translateX(-50%);width:58px;height:58px;border-radius:50%;background:var(--brand);color:#fff;border:3px solid var(--nav);display:grid;place-items:center;box-shadow:0 6px 16px rgba(37,99,235,.35)}
.fab svg{width:26px;height:26px;stroke:#fff;fill:none;stroke-width:2.4;stroke-linecap:round}
.fab:active{transform:translateX(-50%) scale(.95)}
.qa{display:flex;gap:12px;padding:16px 16px 0}
.qa button{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:12px;border-radius:10px;font-weight:600;font-size:15px;background:var(--surface);border:1px solid var(--line)}
.qa button.p{background:var(--brand);border-color:var(--brand);color:#fff}
.qa svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round}
.sech{display:flex;justify-content:space-between;align-items:baseline;padding:20px 16px 8px}
.sech b{font-size:16px;font-weight:600}
.sech span,.sech button{font-size:13.5px;color:var(--muted)}
.sech button{color:var(--brand);font-weight:500}
.group.pad{padding:4px 16px 8px}
.cb{padding:11px 0}.cb + .cb{border-top:1px solid var(--line)}
.cbh{display:flex;justify-content:space-between;gap:8px;font-weight:600;font-size:15px}
.cbn{display:flex;align-items:center;gap:8px;min-width:0}.cbn i{font-style:normal;font-size:17px}
.cbh small{font-weight:400;color:var(--muted);font-size:12.5px}
.pbar{height:8px;border-radius:4px;background:var(--chip);margin:8px 0 5px;overflow:hidden}
.pbar i{display:block;height:100%;border-radius:4px;background:var(--brand)}
.pbar i.over{background:var(--neg)}.pbar i.nb{background:var(--faint)}
.cbf{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted)}
.donutw{position:relative;width:176px;height:176px;margin:10px auto 6px}
.donutw svg{width:100%;height:100%;display:block}
.dc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.dc span{font-size:12px;color:var(--muted)}.dc b{font-size:19px;font-weight:700}
.leg{padding-top:6px}
.leg>div{display:flex;align-items:center;gap:8px;padding:8px 0;font-size:14.5px}
.leg>div + div{border-top:1px solid var(--line)}
.leg i{width:10px;height:10px;border-radius:50%;flex:none}
.leg .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.leg .pc{flex:none;color:var(--muted);font-size:12.5px}
.leg b{flex:none;font-weight:600}
.bars{display:flex;align-items:flex-end;gap:3px;height:140px;padding-top:12px}
.bars i{flex:1;background:#3B82F6;border-radius:4px 4px 0 0;min-height:0}
.bl{display:flex;gap:3px;margin-top:6px;font-size:10px;color:var(--muted)}
.bl span{flex:1;text-align:center;white-space:nowrap;min-width:0;overflow:visible}
.sum2{font-size:13px;color:var(--muted);padding:12px 0 6px}
.sum2 b{color:var(--text);font-weight:600}
button.row .t2{white-space:normal}
.setbox .lab{margin:0 0 8px}
.chev svg{width:18px;height:18px;stroke:var(--faint);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.row.out .t1{color:var(--neg)}
.sw{width:44px;height:26px;border-radius:13px;background:#CBCED4;position:relative;flex:none;transition:.2s}
.sw::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}
.sw.on{background:var(--brand)}.sw.on::after{left:21px}
.setbox{padding:12px 16px}
.foot{text-align:center;font-size:12.5px;color:var(--faint);padding:22px 16px 0}

/* Statistiche */
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 16px}
.kp{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;min-width:0}
.kk{font-size:12.5px;color:var(--muted)}.kv{font-size:20px;font-weight:650;margin-top:4px}.ks{font-size:12px;color:var(--faint);margin-top:2px}
.kc{display:flex;justify-content:space-between;gap:6px;font-size:13px;margin-top:5px}.kc span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pos{color:var(--pos)}.neg{color:var(--neg)}
.andam{width:100%;height:auto;display:block;margin-top:10px}
.andam .gl{stroke:var(--line);stroke-width:1}.andam .be{fill:var(--pos)}.andam .bu{fill:var(--neg)}.andam .pl{opacity:.32}
.andam .pv{stroke:var(--text);stroke-width:2;opacity:.55}.andam .selbg{fill:var(--wash)}
.andam .ml{font-size:10px;fill:var(--muted);text-anchor:middle}.andam .ml.oggi{fill:var(--brand);font-weight:700}
.aleg{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--muted);margin:8px 0 4px}
.dot{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.dot.be{background:var(--pos)}.dot.bu{background:var(--neg)}.dot.pv{background:var(--text);opacity:.55;height:3px;vertical-align:2px}.dot.pl{background:var(--faint);opacity:.6}
.adet{border-top:1px solid var(--line);margin-top:8px;padding-top:8px;font-size:14px}
.adet>div{display:flex;justify-content:space-between;padding:4px 0}.adet small{color:var(--muted)}
.ahint{font-size:12px;color:var(--faint);padding:6px 0 4px}
.prev{width:100%;border-collapse:collapse;font-size:14px;margin-top:6px}
.prev th{font-size:12px;color:var(--muted);font-weight:500;text-align:right;padding:4px 0}
.prev td{padding:7px 0;border-top:1px solid var(--line)}.prev td.num,.prev th{text-align:right;white-space:nowrap;padding-left:12px;font-size:13.5px}.prev td:first-child{font-size:13.5px}
.prev tr.pi td{color:var(--muted)}.prev tr.tot td{font-weight:650}
.psal{display:flex;justify-content:space-between;align-items:baseline;padding:10px 0 2px;font-size:15px}.psal b{font-size:19px}
.row.cst .amt{text-align:right}.row.cst .amt small{color:var(--faint);font-size:12px}
.subs{background:var(--bg);padding:6px 16px 10px 62px;font-size:14px}
.subs>div{display:flex;justify-content:space-between;padding:5px 0}
.subs .vedi{margin-top:6px;color:var(--brand);font-weight:500;font-size:14px;background:none;border:0;padding:4px 0}
</style>
</head>
<body>
<div id="app"></div>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-label="Scegli periodo">
  <div class="hd"><button class="txtbtn" data-act="sheet-close">Annulla</button><b>Periodo</b><button class="txtbtn" data-act="sheet-ok">Fatto</button></div>
  <div class="seg2" id="modeSeg"><button data-mode="mese">Mese</button><button data-mode="anno">Anno</button></div>
  <div class="pick"><select id="selM" aria-label="Mese"></select><select id="selY" aria-label="Anno"></select></div>
  <div class="quick"><button data-act="quick-oggi">Mese corrente</button><button data-act="quick-anno">Anno corrente</button></div>
</div>

<section class="screen" id="scrSearch" aria-label="Cerca">
  <div class="top">
    <button class="ibtn" data-act="close-screen" aria-label="Indietro"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
    <label class="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input id="q" type="search" placeholder="Nota, categoria o sottocategoria" autocomplete="off" enterkeyhint="search"></label>
  </div>
  <div class="body" id="searchBody"></div>
</section>

<section class="screen" id="scrRic" aria-label="Ricorrenze">
  <div class="top">
    <button class="ibtn" data-act="close-screen" aria-label="Indietro"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
    <h2>Ricorrenze</h2>
  </div>
  <div class="body" id="ricBody"></div>
</section>

<section class="screen" id="scrNew" aria-label="Nuovo movimento">
  <div class="top">
    <button class="ibtn" data-act="close-screen" aria-label="Chiudi"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    <h2 id="newTitle">Nuovo movimento</h2>
  </div>
  <div class="body" id="newBody"></div>
  <div class="savebar"><button id="btnSave" data-act="save">Salva</button></div>
</section>

  <div class="top">
    <button class="ibtn" data-act="close-screen" aria-label="Chiudi"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    <h2>Movimento</h2>
  </div>
  <div class="body" id="editBody"></div>
  <div class="savebar"><button id="btnEdit" data-act="edit-save">Salva modifiche</button></div>
</section>

<div class="toast" id="toast"><span id="toastTxt"></span><button id="toastBtn" data-act="toast-undo">Annulla</button></div>

<script>
'use strict';
const API = 'https://script.google.com/macros/s/AKfycbxyoK-WjETQBEUqQ3zad-PJp3V4Mw6gzPcErcHZR9yRsJKrJyJaK9OdmOzvfXWFBIqt/exec';
const K_TOKEN = 'conti.token', K_DATA = 'conti.dati', K_PREF = 'conti.pref', K_LISTE = 'conti.liste', K_CODA = 'conti.coda';
const NUOVA = '➕ Nuova…';
const FREQS = ['Mai','Ogni giorno','Ogni 2 giorni','Ogni 3 giorni','Ogni settimana','Ogni 2 settimane','Ogni 3 settimane','Ogni mese','Ogni 2 mesi','Ogni 3 mesi','Ogni 6 mesi','Ogni anno'];
const MESI = ['gennaio','febbraio','marzo','aprile','maggio','giugno','luglio','agosto','settembre','ottobre','novembre','dicembre'];
const GIORNI = ['domenica','lunedì','martedì','mercoledì','giovedì','venerdì','sabato'];
const ICONE = {
  'Abbigliamento':'👕','Animali':'🐾','Auto':'🚗','Banca':'🏦','Bar e ristoranti':'🍽️','Casa':'🏠','Cultura e svago':'🎭',
  'Figlio':'🧸','Moto':'🏍️','Persona':'💈','Regali':'🎁','Salute':'🩺','Spesa':'🛒','Sport':'🏃','Straordinarie':'🛋️',
  'Tasse e documenti':'📄','Trasporti':'🚇','Utenze e abbonamenti':'💡','Varie':'📦','Viaggi':'✈️','Matrimonio':'💍',
  'Benefit e sussidi':'🎫','Regali ricevuti':'🎁','Ricavi da vendite':'🏷️','Rimborsi':'↩️','Stipendio':'💼','Vincite':'🍀','Prestito ricevuto':'🤝'
};
const SUB_ICONE = {'Carburante':'⛽','Benzina':'⛽','Mutuo':'🏠','Pulizie':'🧽','Babysitter':'🧸','Farmacia':'💊','Dentista':'🦷',
  'Luce':'💡','Gas':'🔥','Internet':'📶','Telefono':'📱','Abbonamenti digitali':'📺','Voli':'✈️','Alloggio':'🛏️','Padel':'🎾','Sci':'⛷️',
  'Bar e drink':'☕','Pranzi e cene':'🍽️','Taxi e Uber':'🚕','Treni':'🚆','Parcheggi':'🅿️','Tab':'🚬','Trattenute':'🧾','Welfare aziendale':'🎫'};

// ---------- utilità ----------
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nf = v => { const [i, d] = Math.abs(v).toFixed(2).split('.'); return i.replace(/\B(?=(\d{3})+(?!\d))/g, '.') + ',' + d; };
const eur = v => (v < 0 ? '−' : '') + nf(v) + ' €';
// arrotondamento al centesimo "da ragioniere": il 5 va sempre per eccesso (9,115 → 9,12; −9,115 → −9,12)
const r2 = v => { const a = Math.round(Math.abs(v) * 100 + 1e-6) / 100; return v < 0 ? -a : a; };
const norm = s => String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
const ls = {
  get(k, d){ try { const v = localStorage.getItem(k); return v === null ? d : v; } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem(k, v); return true; } catch(e){ return false; } },
  del(k){ try { localStorage.removeItem(k); } catch(e){} }
};
function fmtData(s, conAnno){ const [y,m,d] = s.split('-').map(Number); const dt = new Date(y, m-1, d);
  return GIORNI[dt.getDay()] + ' ' + d + ' ' + MESI[m-1] + (conAnno ? ' ' + y : ''); }
const fmtBreve = s => { const [y,m,d] = s.split('-'); return d + '/' + m + '/' + y.slice(2); };
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);

// ---------- stato ----------
const pref = JSON.parse(ls.get(K_PREF, '{}') || '{}');
const S = {
  token: ls.get(K_TOKEN, ''),
  dati: null, righe: [], serie: {}, oggi: '', loading: false, errore: '',
  mode: pref.mode || 'mese', vista: pref.vista || 'mia', y: 0, m: 0, limite: 400,
  tab: 'home', anaM: -1, anaCat: '', filtro: '', nascondi: !!pref.nascondi, tema: pref.tema || 'auto'
};
function salvaPref(){ ls.set(K_PREF, JSON.stringify({mode:S.mode, vista:S.vista, nascondi:S.nascondi, tema:S.tema})); }
function applicaTema(){ const h = document.documentElement; if (S.tema === 'scuro' || S.tema === 'chiaro') h.setAttribute('data-tema', S.tema); else h.removeAttribute('data-tema'); }
applicaTema();

// riga: [id, data, cat, sub, nota, imp, perc, segno, stato, serie, sezione]
function prepara(d){
  const t = new Date(); S.dati = d; S.oggi = t.getFullYear() + '-' + String(t.getMonth() + 1).padStart(2, '0') + '-' + String(t.getDate()).padStart(2, '0');
  S.righe = d.righe.map(r => ({ id:r[0], data:r[1], cat:r[2], sub:r[3], nota:r[4], imp:r[5], perc:r[6], segno:r[7], stato:r[8], serie:r[9], sez:r[10],
    tipo:r[11] || (r[7] > 0 ? 'Entrata' : 'Uscita'), evento:r[12] || '', det:r[13] || '', k: norm(r[2] + ' ' + r[3] + ' ' + r[4] + ' ' + (r[12] || '')) }));
  S.righe.sort((a, b) => a.data < b.data ? 1 : a.data > b.data ? -1 : (a.id < b.id ? 1 : -1));
  S.righe.forEach(r => { if (r.stato === 'Pianificata' && r.data <= S.oggi) r.stato = 'Valida'; });   // conta dal giorno in cui accade
  S.serie = {};
  (d.ric || []).forEach(x => { S.serie[x[0]] = {id:x[0], freq:x[1], inizio:x[2], fine:x[3], stato:x[4], tipo:x[5], cat:x[6], sub:x[7], imp:x[8], perc:x[9], nota:x[10]}; });
  if (!S.y) { const [y, m] = S.oggi.split('-').map(Number); S.y = y; S.m = m; }
}
const valore = r => r2((S.vista === 'mia' ? r.imp * r.perc : r.imp) * r.segno);
const inPeriodo = r => S.mode === 'anno' ? r.data.startsWith(S.y + '-') : r.data.startsWith(S.y + '-' + String(S.m).padStart(2,'0') + '-');

// ---------- dati ----------
async function carica(fresh){
  if (!S.token || S.loading) return;
  S.loading = true; S.errore = ''; renderStatus();
  try {
    const url = API + '?a=dati' + (fresh ? '&fresh=1' : '') + '&t=' + encodeURIComponent(S.token);
    const res = await fetch(url, {cache:'no-store'});
    const txt = await res.text();
    const d = JSON.parse(txt);
    if (!d.ok) { S.errore = d.error === 'token' ? 'Accesso scaduto: inserisci di nuovo la password' : 'Errore dal server'; if (d.error === 'token') { S.token = ''; ls.del(K_TOKEN); } }
    else { prepara(d); ls.set(K_DATA, txt); }
  } catch(e) { S.errore = 'Offline: mostro gli ultimi dati scaricati'; }
  S.loading = false; render();
}

// ---------- render ----------
const ICO = {
  search:'<svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>',
  rep:'<svg viewBox="0 0 24 24"><path d="M17 2l3 3-3 3"/><path d="M4 11V9a4 4 0 0 1 4-4h12"/><path d="M7 22l-3-3 3-3"/><path d="M20 13v2a4 4 0 0 1-4 4H4"/></svg>',
  ref:'<svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg>',
  prev:'<svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>',
  next:'<svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>',
  key:'<svg viewBox="0 0 24 24"><circle cx="8" cy="15" r="4"/><path d="M11 12l9-9M17 6l3 3"/></svg>',
  eye:'<svg viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>',
  eyeoff:'<svg viewBox="0 0 24 24"><path d="M3 3l18 18"/><path d="M10.6 6.1A10.9 10.9 0 0 1 12 6c6.5 0 10 6 10 6a17 17 0 0 1-3.2 3.9M6.6 6.7C3.9 8.4 2 12 2 12s3.5 6 10 6c1.6 0 3-.3 4.3-.9"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>',
  ent:'<svg viewBox="0 0 24 24"><path d="M17 7L7 17M17 17H7V7"/></svg>',
  usc:'<svg viewBox="0 0 24 24"><path d="M7 17L17 7M7 7h10v10"/></svg>',
  plus:'<svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>',
  home:'<svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/></svg>',
  list:'<svg viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"/></svg>',
  chart:'<svg viewBox="0 0 24 24"><path d="M3 3v18h18"/><path d="M18 17V9"/><path d="M13 17V5"/><path d="M8 17v-3"/></svg>',
  sliders:'<svg viewBox="0 0 24 24"><path d="M4 6h9M19 6h1M4 12h3M13 12h7M4 18h11M21 18h-1"/><circle cx="16" cy="6" r="2.2"/><circle cx="10" cy="12" r="2.2"/><circle cx="17.5" cy="18" r="2.2"/></svg>',
  esci:'<svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>'
};
function icona(r){ return SUB_ICONE[r.sub] || ICONE[r.cat] || (r.segno > 0 ? '💶' : '🔹'); }
const pulisci = s => String(s || '').replace(/^[^\p{L}\p{N}]+/u, '').trim();
function aggiornaIcone(){                                   // icone scelte nel foglio Categorie (colonna J)
  if (!S.liste) return;
  ['Uscita', 'Entrata'].forEach(t => (S.liste[t] || []).forEach(l => { const c = pulisci(l), e = l.slice(0, l.length - c.length).trim(); if (c && e && l !== NUOVA) ICONE[c] = e; }));
}

function rigaHTML(r){
  const v = valore(r), alt = r2((S.vista === 'mia' ? r.imp : r.imp * r.perc) * r.segno);
  const fam = r.perc > 0 && r.perc < 1;
  const rep = r.serie && S.serie[r.serie] ? '<span class="rep">⟳ ' + esc(S.serie[r.serie].freq) + '</span>' : '';
  const t2 = [r.sub && r.sub !== 'Generica' ? esc(r.sub) : '', r.nota ? esc(r.nota) : '', rep, r.evento ? '🏷 ' + esc(r.evento) : ''].filter(Boolean).join(' · ');
  const s = fam ? '<div class="s num">' + (S.vista === 'mia' ? 'tot. ' : 'tua ') + eur(Math.abs(alt)).replace('−','') + '</div>' : '';
  return '<div class="row' + (r.stato === 'Pianificata' ? ' plan' : '') + '" data-id="' + esc(r.id) + '">' +
    '<div class="ico' + (r.segno > 0 ? ' in' : '') + '" aria-hidden="true">' + icona(r) + '</div>' +
    '<div class="txt"><div class="t1">' + esc(r.cat) + '</div>' + (t2 ? '<div class="t2">' + t2 + '</div>' : '') + '</div>' +
    '<div class="amt"><div class="v num ' + (v < 0 ? 'neg' : 'pos') + '">' + eur(v) + '</div>' + s + '</div></div>';
}

function listaHTML(righe, conAnno, limite){
  if (!righe.length) return '';
  let h = '', giorno = '', mese = '', n = 0, buf = [];
  const flush = () => { if (!buf.length) return;
    const tot = r2(buf.reduce((a, r) => a + (r.stato === 'Pianificata' ? 0 : valore(r)), 0));
    const fut = buf.every(r => r.stato === 'Pianificata');
    h += '<div class="day' + (fut ? ' future' : '') + '"><span>' + esc(fmtData(giorno, conAnno)) + '</span>' +
         (fut ? '<span class="tot">pianificato</span>' : '<span class="tot num ' + (tot < 0 ? 'neg' : 'pos') + '">' + eur(tot) + '</span>') + '</div>' +
         '<div class="group">' + buf.map(rigaHTML).join('') + '</div>';
    buf = []; };
  for (const r of righe) {
    if (n >= limite) break;
    if (r.data !== giorno) { flush(); giorno = r.data;
      const mm = r.data.slice(0, 7);
      if (S.mode === 'anno' && conAnno === false && mm !== mese) { mese = mm; h += '<div class="month">' + cap(MESI[Number(mm.slice(5)) - 1]) + '</div>'; } }
    buf.push(r); n++;
  }
  flush();
  return h;
}

function totali(righe){
  let ent = 0, usc = 0, pEnt = 0, pUsc = 0;
  for (const r of righe) {
    const v = valore(r), inn = r.sez === 'Entrate' || r.sez === 'Rettifica';
    if (r.stato === 'Pianificata') { if (inn) pEnt += v; else pUsc -= v; }
    else { if (inn) ent += v; else usc -= v; }
  }
  return {ent:r2(ent), usc:r2(usc), saldo:r2(ent - usc), pEnt:r2(pEnt), pUsc:r2(pUsc), conPian:r2(ent - usc + pEnt - pUsc)};
}

const mk = s => S.nascondi ? '••••••' : s;
const periodoLabel = () => S.mode === 'anno' ? String(S.y) : cap(MESI[S.m - 1]) + ' ' + S.y;
const isEnt = r => r.sez === 'Entrate' || r.sez === 'Rettifica';

/** Intervallo del periodo scelto e lo stesso periodo dell'anno prima (se il periodo è in corso, fino a oggi). */
function limitiPeriodo(){
  const y = S.y, mm = String(S.m).padStart(2, '0');
  const a = S.mode === 'anno' ? y + '-01-01' : y + '-' + mm + '-01', f = S.mode === 'anno' ? y + '-12-31' : y + '-' + mm + '-31';
  const b = a <= S.oggi && f > S.oggi ? S.oggi : f, dec = s => (Number(s.slice(0, 4)) - 1) + s.slice(4);
  return { a, f, b, pa: dec(a), pb: dec(b) };
}
/** Uscite (netto rimborsi) per categoria tra due date, solo righe già avvenute. */
function spesePer(da, a){
  const m = {};
  for (const r of S.righe) {
    if (r.stato === 'Pianificata' || r.data < da || r.data > a || isEnt(r)) continue;
    m[r.cat] = r2((m[r.cat] || 0) - valore(r));
  }
  return m;
}

function headerHTML(T, compact){
  const capH = (S.mode === 'anno' ? "Saldo dell'anno" : 'Saldo del mese') + (S.vista === 'tot' ? ' · totale famiglia' : '');
  const plan = (T.pEnt || T.pUsc) ? '<div class="plan num">Con le pianificate: ' + mk(eur(T.conPian)) + '</div>' : '';
  return '<header id="hdr"><div class="bar">' +
      '<div class="period"><button class="ibtn small" data-act="prev" aria-label="Periodo precedente">' + ICO.prev + '</button>' +
      '<button class="lbl" data-act="picker">' + esc(periodoLabel()) + '<span class="caret">▾</span></button>' +
      '<button class="ibtn small" data-act="next" aria-label="Periodo successivo">' + ICO.next + '</button></div>' +
      '<button class="ibtn" data-act="ric" aria-label="Ricorrenze">' + ICO.rep + '</button>' +
      '<button class="ibtn" data-act="search" aria-label="Cerca">' + ICO.search + '</button>' +
    '</div>' +
    '<div class="hero' + (compact ? ' c' : '') + '"><div class="cap"><span>' + capH + '</span><button class="ibtn small" data-act="privacy" aria-label="' + (S.nascondi ? 'Mostra il saldo' : 'Nascondi il saldo') + '">' +
        (S.nascondi ? ICO.eyeoff : ICO.eye) + '</button></div>' +
      '<div class="big num">' + mk(eur(T.saldo)) + '</div>' +
      (compact ? '' : '<div class="tiles num"><div><div class="k in">' + ICO.ent + 'Entrate</div><div class="v">' + mk(eur(T.ent)) + '</div></div>' +
        '<div><div class="k out">' + ICO.usc + 'Uscite</div><div class="v">' + mk(eur(T.usc)) + '</div></div></div>' + plan) +
      '<div class="seg" role="tablist"><button data-vista="mia" class="' + (S.vista === 'mia' ? 'on' : '') + '">Mia quota</button>' +
      '<button data-vista="tot" class="' + (S.vista === 'tot' ? 'on' : '') + '">Totale</button></div></div></header>';
}

function navHTML(){
  const b = (id, lab, ico) => '<button data-tab="' + id + '" class="' + (S.tab === id ? 'on' : '') + '" aria-label="' + lab + '" title="' + lab + '"' + (S.tab === id ? ' aria-current="page"' : '') + '>' + ico + '</button>';
  const curva = 'M0,.5 C20,.5 26,6 34,16 C42,28 46,38 56,38 C66,38 70,28 78,16 C86,6 92,.5 112,.5';
  return '<nav class="tabs" aria-label="Sezioni"><div class="nl">' + b('home', 'Home', ICO.home) + b('mov', 'Movimenti', ICO.list) + '</div>' +
    '<div class="nc"><svg viewBox="0 0 112 40" preserveAspectRatio="none" aria-hidden="true"><path class="cf" d="' + curva + ' L112,40 L0,40 Z"/><path class="cs" d="' + curva + '"/></svg>' +
    '<div class="nfill"></div><button class="fab" data-act="new" aria-label="Nuovo movimento">' + ICO.plus + '</button></div>' +

// ---------- Statistiche (tab Analisi) ----------
const k2 = r => r.cat + '|' + r.sub;
const mesiCh = y => { const oy = Number(S.oggi.slice(0, 4)); return y < oy ? 12 : y > oy ? 0 : Number(S.oggi.slice(5, 7)) - 1; };   // mesi già chiusi
/** Per mese dell'anno y: entrate/uscite reali e pianificate (valore secondo Mia quota/Totale). */
function annoDati(y){
  const M = Array.from({length:12}, () => ({ent:0, usc:0, pe:0, pu:0}));
  for (const r of S.righe) {
    if (!r.data.startsWith(y + '-')) continue;
    const m = M[Number(r.data.slice(5, 7)) - 1], v = valore(r), p = r.stato === 'Pianificata';
    if (isEnt(r)) { if (p) m.pe += v; else m.ent += v; } else { if (p) m.pu -= v; else m.usc -= v; }
  }
  M.forEach(m => { for (const k in m) m[k] = r2(m[k]); });
  return M;
}
const somma = (M, k, a, b) => r2(M.slice(a === undefined ? 0 : a, b === undefined ? 12 : b).reduce((s, m) => s + m[k], 0));
/** Importi per mese e voce (cat|sub) dell'anno y: {ent:{}, usc:{}} per reali e pianificate separatamente. */
function voci(y){
  const R = Array.from({length:12}, () => ({}) ), P = Array.from({length:12}, () => ({}) );
  for (const r of S.righe) {
    if (!r.data.startsWith(y + '-')) continue;
    const i = Number(r.data.slice(5, 7)) - 1, T = r.stato === 'Pianificata' ? P[i] : R[i], k = (isEnt(r) ? 'E|' : 'U|') + k2(r);
    T[k] = (T[k] || 0) + (isEnt(r) ? valore(r) : -valore(r));
  }
  return {R, P};
}
/** Previsione di fine anno: mesi chiusi = reale; mese in corso e futuri = pianificate, e per le voci senza
 *  pianificate lo stesso mese dell'anno prima (per il mese in corso solo la parte non ancora spesa). */
function previsione(y){
  const ch = mesiCh(y), cur = voci(y), pre = voci(y - 1), o = {realeE:0, realeU:0, pianE:0, pianU:0, stimaE:0, stimaU:0};
  for (let i = 0; i < 12; i++) {
    const R = cur.R[i], P = cur.P[i], A = pre.R[i];
    for (const k in R) if (k[0] === 'E') o.realeE += R[k]; else o.realeU += R[k];
    if (i < ch) continue;
    for (const k in P) if (k[0] === 'E') o.pianE += P[k]; else o.pianU += P[k];
    for (const k in A) {
      if (P[k] || !(A[k] > 0)) continue;
      const resto = Math.max(A[k] - (i === ch ? (R[k] || 0) : 0), 0);
      if (k[0] === 'E') o.stimaE += resto; else o.stimaU += resto;
    }
  }
  for (const k in o) o[k] = r2(o[k]);
  o.E = r2(o.realeE + o.pianE + o.stimaE); o.U = r2(o.realeU + o.pianU + o.stimaU); o.saldo = r2(o.E - o.U);
  return o;
}

function kpiHTML(y){
  const ch = mesiCh(y), oy = Number(S.oggi.slice(0, 4));
  if (y > oy) return '';
  const M = annoDati(y), ent = somma(M, 'ent'), usc = somma(M, 'usc'), saldo = r2(ent - usc);
  const nMed = ch > 0 ? ch : 1, med = r2(somma(M, 'usc', 0, nMed) / nMed);
  const L = { a: y + '-01-01', b: y < oy ? y + '-12-31' : S.oggi }, cur = spesePer(L.a, L.b), prev = spesePer((y - 1) + L.a.slice(4), (y - 1) + L.b.slice(4));
  const cresc = Object.keys(cur).map(c => [c, r2(cur[c] - (prev[c] || 0))]).filter(x => x[1] > 0).sort((a, b) => b[1] - a[1]).slice(0, 3);
  const tile = (k, v, s, cls) => '<div class="kp"><div class="kk">' + k + '</div><div class="kv num' + (cls ? ' ' + cls : '') + '">' + v + '</div>' + (s ? '<div class="ks">' + s + '</div>' : '') + '</div>';

function andamentoHTML(y){
  const M = annoDati(y), A = annoDati(y - 1), ch = mesiCh(y);

  M.forEach((m, i) => {

  return '<div class="sech"><b>Andamento ' + y + '</b></div><div class="group pad">' + s +
    '<div class="aleg"><span><i class="dot be"></i>Entrate</span><span><i class="dot bu"></i>Uscite</span><span><i class="dot pv"></i>Uscite ' + (y - 1) + '</span><span><i class="dot pl"></i>Pianificate</span></div>' + det + '</div>';

function catStatHTML(){
  const L = limitiPeriodo(), cur = {}, prev = {}, sub = {};
  for (const r of S.righe) {
    if (r.stato === 'Pianificata' || isEnt(r)) continue;
    const v = -valore(r);
    if (r.data >= L.a && r.data <= L.b) { cur[r.cat] = (cur[r.cat] || 0) + v; (sub[r.cat] = sub[r.cat] || {})[r.sub] = ((sub[r.cat] || {})[r.sub] || 0) + v; }
    else if (r.data >= L.pa && r.data <= L.pb) prev[r.cat] = (prev[r.cat] || 0) + v;
  }
  const cats = Object.keys(cur).filter(c => r2(cur[c]) > 0)
    .sort((a, b) => (cur[b] || 0) - (cur[a] || 0));
  if (!cats.length) return '';
  const lab = S.mode === 'anno' ? String(S.y - 1) : cap(MESI[S.m - 1]) + ' ' + (S.y - 1);
  return '<div class="sech"><b>Categorie</b><span>vs ' + esc(lab) + (L.b < L.f ? ' (stesso periodo)' : '') + '</span></div><div class="group">' + cats.map(c => {
    const v = r2(cur[c] || 0), p = r2(prev[c] || 0), d = r2(v - p), open = S.anaCat === c;
    const dl = p > 0 ? (d > 0 ? '+' : d < 0 ? '−' : '') + mk(nf(d)) + ' € · ' + (d >= 0 ? '+' : '−') + Math.abs(Math.round(d / p * 100)) + '%' : (v > 0 ? 'nuova' : '');

    if (open) {

        '<button class="vedi" data-filtro="cat:' + esc(c) + '" data-gomov="1">Vedi i movimenti</button></div>';
    }
    return h;
  }).join('') + '</div>';
}

function previsioneHTML(y){

async function invia(righe, undo){

  const tipo = r.tipo === 'Entrata' ? 'Entrata' : 'Uscita', L = S.liste;
  const catL = (L[tipo] || []).find(c => pulisci(c) === r.cat) || r.cat;
  E = { r, tipo, imp:String(r.imp).replace('.', ','), cat:catL, sub:r.sub, data:r.data, nota:r.nota, perc:r.perc >= 1 ? '100% personale' : '50% familiare', det:r.det === 'SI' ? 'Sì' : r.det === 'NO' ? 'No' : '' };
  renderModifica(); apri('#scrEdit');
}
function renderModifica(){
  const L = S.liste, r = E.r, cats = (L[E.tipo] || []).filter(c => c !== NUOVA);
  if (cats.indexOf(E.cat) < 0) cats.unshift(E.cat);
  const subs = ['Generica'].concat(String((L.sub || {})[E.cat] || '').split('\n').filter(Boolean));
  if (subs.indexOf(E.sub) < 0) subs.push(E.sub);
  const isDet = (L.det || {})[E.cat + '|' + E.sub];
  const v = valore(r);
  $('#editBody').innerHTML = '<div class="form">' +
    '<div class="row" style="padding:0 0 6px"><div class="ico' + (r.segno > 0 ? ' in' : '') + '">' + icona(r) + '</div><div class="txt"><div class="t1">' + esc(r.cat) + '</div><div class="t2">' +
    esc(fmtData(r.data, true)) + (r.stato === 'Pianificata' ? ' · pianificata' : '') + (r.serie ? ' · ⟳ ricorrenza' : '') + (r.tipo === 'Storno' ? ' · rimborso' : '') + '</div></div>' +
    '<div class="amt"><div class="v num ' + (v < 0 ? 'neg' : 'pos') + '">' + eur(v) + '</div></div></div>' +
    '<div class="lab">Importo totale</div><label class="amtin"><input id="eImp" inputmode="decimal" value="' + esc(E.imp) + '"><span>€</span></label>' +
    '<div class="lab">A tuo carico</div><div class="seg3">' + ['100% personale','50% familiare'].map(x => '<button data-e="perc" data-v="' + x + '" class="' + (E.perc === x ? 'on' : '') + '">' + x + '</button>').join('') + '</div>' +
    '<div class="row2"><div><div class="lab">Categoria</div><select class="fld" id="eCat">' + cats.map(c => '<option' + (c === E.cat ? ' selected' : '') + '>' + esc(c) + '</option>').join('') + '</select></div>' +
    '<div><div class="lab">Sottocategoria</div><select class="fld" id="eSub">' + subs.map(c => '<option' + (c === E.sub ? ' selected' : '') + '>' + esc(c) + '</option>').join('') + '</select></div></div>' +
    (isDet ? '<div class="lab">Detraibile 730?</div><div class="seg3">' + ['Sì','No'].map(x => '<button data-e="det" data-v="' + x + '" class="' + (E.det === x ? 'on' : '') + '">' + x + '</button>').join('') + '</div>' : '') +
    '<div class="row2"><div><div class="lab">Data</div><input class="fld" type="date" id="eData" value="' + E.data + '"></div><div></div></div>' +
    '<div class="lab">Nota</div><input class="fld" id="eNota" value="' + esc(E.nota) + '" placeholder="Nessuna nota">' +
    '<div class="lab" style="margin-top:26px">Annullare</div><button class="danger" data-act="del-one">Annulla questo movimento</button>' +
    (r.serie ? '<button class="danger" data-act="del-serie">Annulla questo e tutti i futuri della serie</button>' : '') +
    (r.evento ? '<div class="hint" style="margin-top:14px">🏷 Evento: ' + esc(r.evento) + '</div>' : '') + '</div>';
}
function leggiE(){ E.imp = $('#eImp').value; E.cat = $('#eCat').value; E.sub = $('#eSub').value; E.data = $('#eData').value; E.nota = $('#eNota').value; }
function salvaModifica(){
  leggiE();
  const r = E.r, out = [], ed = (campo, valore) => out.push({ edit:true, id:r.id, campo, valore });
  if (Math.abs(numero(E.imp) - r.imp) > 0.004 && numero(E.imp) > 0) ed('importo', String(numero(E.imp)));
  if (pulisci(E.cat) !== r.cat || E.sub !== r.sub) ed('categoria', E.cat + '|' + E.sub);
  if (E.data !== r.data && /^\d{4}-\d{2}-\d{2}$/.test(E.data)) ed('data', E.data);
  if (E.nota.trim() !== r.nota) ed('nota', E.nota.trim().replace(/["\\]/g, '') || 'Nessuna nota');
  const p = E.perc.startsWith('100') ? 1 : 0.5; if (Math.abs(p - r.perc) > 0.001) ed('perc', E.perc);
  const d = E.det === 'Sì' ? 'SI' : E.det === 'No' ? 'NO' : ''; if (d && d !== r.det) ed('det', E.det);
  chiudiSchermate();
  if (!out.length) { toast('Nessuna modifica'); return; }
  Object.assign(r, { imp:numero(E.imp) || r.imp, cat:pulisci(E.cat), sub:E.sub, data:E.data, nota:E.nota.trim(), perc:p });
  render(); invia(out);
}
function annullaRiga(serie){
  const r = E.r; chiudiSchermate();
  S.righe = S.righe.filter(x => serie ? !(x.serie && x.serie === r.serie && x.data >= r.data) && x.id !== r.id : x.id !== r.id);
  render(); invia([{ void:true, id:r.id, serie:!!serie }]);
}

// ---------- schermate ----------
function apri(id){ $(id).classList.add('open'); }
function chiudiSchermate(){ document.querySelectorAll('.screen.open').forEach(s => s.classList.remove('open')); $('#q').blur(); if (document.activeElement) document.activeElement.blur(); }

document.addEventListener('click', e => {
  const t = e.target.closest('[data-anam],[data-acat],[data-act],[data-vista],[data-mode],[data-f],[data-e],[data-pref],[data-tab],[data-filtro],[data-tema],.row[data-id]');
  if (!t) { if (e.target.id === 'scrim') chiudiPicker(false); return; }
  if (t.dataset.anam !== undefined) { const i = Number(t.dataset.anam); S.anaM = S.anaM === i ? -1 : i; render(); return; }
  if (t.dataset.acat !== undefined) { S.anaCat = S.anaCat === t.dataset.acat ? '' : t.dataset.acat; render(); return; }
  if (t.dataset.pref) { rapido(t.dataset.pref); return; }
  if (t.dataset.tab) { S.tab = t.dataset.tab; render(); window.scrollTo(0, 0); return; }
  if (t.dataset.filtro !== undefined) { S.filtro = t.dataset.filtro; S.limite = 400; if (t.dataset.gomov) { S.tab = 'mov'; window.scrollTo(0, 0); } render(); return; }
  if (t.dataset.tema) { S.tema = t.dataset.tema; salvaPref(); applicaTema(); render(); return; }
  if (t.dataset.f) { leggiCampi(); const k = t.dataset.f, v = t.dataset.v;
    if (k === 'tipo' && F.tipo !== v) { F.cat = ''; F.sub = 'Generica'; }
    if (k === 'cat' && F.cat !== v) { F.sub = 'Generica'; F.det = ''; }
    if (k === 'nota') F.nota = v; else F[k] = v;
    renderNuovo(); return; }
  if (t.dataset.e) { leggiE(); E[t.dataset.e] = t.dataset.v; renderModifica(); return; }
  if (t.classList.contains('row') && t.dataset.id && !t.dataset.act) { apriModifica(t.dataset.id); return; }
  if (t.dataset.vista) { S.vista = t.dataset.vista; salvaPref(); render(); return; }
  if (t.dataset.mode) { pick.mode = t.dataset.mode; syncPicker(); return; }
  switch (t.dataset.act) {
    case 'prev': step(-1); break;
    case 'next': step(1); break;
    case 'picker': apriPicker(); break;
    case 'sheet-close': chiudiPicker(false); break;
    case 'sheet-ok': chiudiPicker(true); break;
    case 'quick-oggi': { const [y, m] = S.oggi.split('-').map(Number); pick = {mode:'mese', y, m}; chiudiPicker(true); break; }
    case 'quick-anno': { pick = {mode:'anno', y:Number(S.oggi.slice(0, 4)), m:S.m}; chiudiPicker(true); break; }
    case 'refresh': carica(true); break;
    case 'retry': carica(false); break;
    case 'more': S.limite += 400; render(); break;
    case 'fut': S.futAperte = !S.futAperte; render(); break;
    case 'search': qLim = 200; apri('#scrSearch'); cerca(); setTimeout(() => $('#q').focus(), 260); break;
    case 'qmore': qLim += 200; cerca(); break;
    case 'ric': renderRic(); apri('#scrRic'); break;
    case 'close-screen': chiudiSchermate(); break;
    case 'new': $('#btnSave').dataset.act = 'save'; apriNuovo(); break;
    case 'new-tipo': $('#btnSave').dataset.act = 'save'; apriNuovo(t.dataset.v); break;
    case 'privacy': S.nascondi = !S.nascondi; salvaPref(); render(); break;
    case 'esci': esci(); break;
    case 'save': salvaNuovo(); break;
    case 'stip': apriStipendio(); break;
    case 'stip-save': salvaStipendio(); break;
    case 'evento': evento(); if (S.tab === 'imp') render(); break;
    case 'ev-save': salvaEvento(); break;
    case 'ev-chiudi': invia([{ evento:'chiudi', data:S.oggi }]); S.liste.evento = ''; render(); break;
    case 'edit-save': salvaModifica(); break;
    case 'del-one': annullaRiga(false); break;
    case 'del-serie': annullaRiga(true); break;
    case 'toast-undo': if (toastUndo) { const u = toastUndo; toastUndo = null; $('#toast').classList.remove('on');
      S.righe = S.righe.filter(x => x.id !== u.id && !(u.serie && x.serie === u.id)); render(); invia([{ void:true, id:u.id, serie:u.serie }]); } break;
  }
});
$('#selY').addEventListener('change', e => { pick.y = Number(e.target.value); });
$('#selM').addEventListener('change', e => { pick.m = Number(e.target.value); });
$('#q').addEventListener('input', () => { clearTimeout(qTimer); qLim = 200; qTimer = setTimeout(cerca, 150); });
$('#newBody').addEventListener('input', () => { if (F) aggiornaSalva(); });
$('#newBody').addEventListener('change', e => { if (F && (e.target.id === 'fRip')) { leggiCampi(); renderNuovo(); } });
$('#editBody').addEventListener('change', e => { if (E && e.target.id === 'eCat') { leggiE(); E.sub = 'Generica'; renderModifica(); } });
window.addEventListener('online', () => invia());
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && S.dati) { carica(false); if (coda().length) invia(); } });

// ---------- avvio ----------
(function avvio(){
  try { const l = ls.get(K_LISTE, ''); if (l) { S.liste = JSON.parse(l); aggiornaIcone(); } } catch(e) {}
  const c = ls.get(K_DATA, '');
  if (c) { try { prepara(JSON.parse(c)); } catch(e) { ls.del(K_DATA); } }
  render();
  if (S.token) { carica(false); caricaListe(); if (coda().length) invia(); }
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
</body>
